version: '3.8'
services:
  app:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=e_posyandu
      - DB_USER=salsabil
  db:
    image: mariadb:12
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: e_posyandu
      MYSQL_USER: salsabil
      MYSQL_PASSWORD: ""
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
volumes:
  db-data:
