name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t e-posyandu:latest .
      - name: Push to Registry
        run: |
          echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_REGISTRY_USERNAME }}" --password-stdin
          docker tag e-posyandu:latest ${{ secrets.DOCKER_REGISTRY_URL }}/e-posyandu:latest
          docker push ${{ secrets.DOCKER_REGISTRY_URL }}/e-posyandu:latest
